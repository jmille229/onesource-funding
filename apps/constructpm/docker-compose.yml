# ConstructPM — Local Development Stack
# All services bind to 127.0.0.1 only — not accessible on network interfaces

services:
  postgres:
    image: postgres:16-alpine
    container_name: cpm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: constructpm
      POSTGRES_PASSWORD: constructpm_dev
      POSTGRES_DB: constructpm_dev
    ports:
      - "127.0.0.1:5432:5432"   # Localhost only — not network-accessible
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/01-init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U constructpm -d constructpm_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cpm-redis
    restart: unless-stopped
    command: redis-server --requirepass constructpm_redis_dev --appendonly yes --bind 0.0.0.0
    ports:
      - "127.0.0.1:6379:6379"   # Localhost only
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "constructpm_redis_dev", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: cpm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: constructpm
      MINIO_ROOT_PASSWORD: constructpm_minio_dev
    ports:
      - "127.0.0.1:9000:9000"   # Localhost only
      - "127.0.0.1:9001:9001"   # MinIO Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: cpm-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 constructpm constructpm_minio_dev;
      mc mb --ignore-existing local/constructpm-files;
      mc mb --ignore-existing local/constructpm-quarantine;
      exit 0;
      "
      # SECURITY: No 'mc anonymous set download' — buckets are private.
      # All file access goes through pre-signed URLs generated by the API.

  mailhog:
    image: mailhog/mailhog:latest
    container_name: cpm-mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"   # Web UI → http://localhost:8025

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  default:
    name: constructpm-network
