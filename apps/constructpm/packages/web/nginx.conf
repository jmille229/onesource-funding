server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ─── Security headers: set by Caddy, not here ──────────────
    # nginx does not inherit `add_header` into a location block that declares
    # its own add_header. Both location blocks below do (Cache-Control), so a
    # CSP declared at this level was silently dropped for index.html and every
    # hashed asset — the responses that mattered. Rather than repeat six headers
    # in three places and hope they stay in sync, the TLS-terminating proxy
    # (Caddyfile) sets them once for every response. This container is never
    # reached except through it.

    # ─── Gzip compression ──────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml application/atom+xml
        image/svg+xml font/truetype font/opentype;
    gzip_min_length 1000;

    # ─── Static assets — long cache (Vite uses content hashes) ─
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Health check endpoint ─────────────────────────────────
    location = /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # ─── SPA fallback — all routes serve index.html ────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ─── Block hidden files (.env, .git, etc.) ─────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
