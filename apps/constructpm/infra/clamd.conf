# clamd for ConstructPM uploads (mounted by the `clamav` service).
# The API streams each file over TCP (INSTREAM) on the private Docker network.
Foreground yes
LogTime yes
LogVerbose no
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
# Uploads are capped at 50 MB (25 MB on the application), so allow a little more.
StreamMaxLength 60M
MaxFileSize 60M
MaxScanSize 150M
# Reload signatures in place rather than holding two copies in memory.
ConcurrentDatabaseReload no
